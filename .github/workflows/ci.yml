name: CI

# Toute branche poussée passe la CI complète (tests + image + test de fumée) ;
# seules main et les tags v* publient. main n'avance qu'une fois la branche verte.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Moindre privilège par défaut ; seul le job de publication peut écrire dans le registre.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests et audits
    runs-on: ubuntu-latest
    steps:
      # Les actions sont épinglées par SHA : un tag déplacé ne peut pas injecter de code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: mbstring, intl, gd, zip, pdo_sqlite, bcmath, sodium
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Dépendances PHP
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Dépendances JS et build du front
        run: |
          npm ci --no-audit --no-fund
          npx vite build

      - name: Environnement Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Tests
        run: php artisan test

      - name: Tests JavaScript
        run: node --test tests/js/*.test.mjs

      # Code 100 : Packagist n'a pas répondu. Une panne réseau n'est pas une faille et ne doit
      # pas bloquer une publication, mais une faille (code 1) échoue tout de suite, sans réessai.
      - name: Audit des dépendances PHP
        run: |
          for attempt in 1 2 3; do
            status=0
            composer audit --no-interaction || status=$?
            [ "$status" -ne 100 ] && exit "$status"
            echo "Packagist injoignable (essai $attempt/3)"
            sleep 30
          done
          exit 100

      - name: Audit des dépendances JS
        run: npm audit --audit-level=high

  image:
    name: Image Docker
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # signature cosign sans clé
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tout l'historique et les étiquettes : la version se lit dans git describe
          fetch-depth: 0

      - name: Nom de l'image (ghcr impose des minuscules)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # « 1.0.0 » pour une version étiquetée v1.0.0, « 1.0.0-3-g096bfb7 » pour main trois commits
      # plus loin, l'empreinte du commit avant toute version. Affichée dans À propos.
      - name: Version de l'application
        run: |
          version=$(git describe --tags --match 'v[0-9]*' --always)
          echo "APP_VERSION=${version#v}" >> "$GITHUB_ENV"
          echo "Version : ${version#v}"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Tags et version
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Build de l'image de test (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/alpine/Dockerfile
          platforms: linux/amd64
          load: true
          tags: opentransfer:smoke
          build-args: VERSION=${{ env.APP_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # On ne publie jamais une image qui ne démarre pas.
      - name: Test de fumée du conteneur
        run: |
          docker run -d --name ot -p 8080:80 opentransfer:smoke
          # On attend que /up ET / répondent : un échec persistant échoue quand même au bout de 2 min.
          up=000; home=000
          for i in $(seq 1 60); do
            up=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/up || true)
            home=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)
            [ "$up" = "200" ] && [ "$home" = "200" ] && break
            sleep 2
          done
          # Chaque vérification ratée devient sa propre annotation (lisible sans authentification).
          fails=0
          check() {
            label=$1; shift
            if "$@" >/dev/null 2>&1; then echo "OK   $label"; else echo "::error title=Test de fumée::$label"; fails=$((fails + 1)); fi
          }
          check "/up répond 200 (reçu $up)" test "$up" = 200
          check "/ répond 200 (reçu $home)" test "$home" = 200
          check "PHP 8.5 dans l'image" sh -c 'docker exec ot php -v | grep -q "^PHP 8\.5"'
          check "tusd installé" docker exec ot tusd -version
          check "pas de dépendances de dev dans l'image" docker exec ot test ! -d /var/www/html/vendor/phpunit
          # Vu du conteneur, l'hôte arrive depuis une IP privée, comme un reverse proxy.
          hook='{"Type":"post-receive"}'
          ext=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d "$hook" http://localhost:8080/api/tusd-hooks || true)
          int=$(docker exec ot curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d "$hook" http://localhost/api/tusd-hooks || true)
          check "hooks tusd refusés depuis l'extérieur (reçu $ext)" test "$ext" = 403
          check "hooks tusd acceptés depuis le conteneur (reçu $int)" test "$int" = 200
          # /up peut répondre alors que l'upload (tusd) ou les e-mails (worker) sont morts.
          sleep 10
          check "storage inscriptible par l'utilisateur applicatif" docker exec -u erugo ot test -w /var/www/html/storage/logs
          check "tusd en cours d'exécution" docker exec ot pgrep -f /usr/local/bin/tusd
          check "worker de file d'attente en cours d'exécution" docker exec ot pgrep -f 'artisan queue:work'
          check "aucun processus abandonné par supervisord" sh -c "! docker logs ot 2>&1 | grep -qE 'gave up|FATAL|exited: .*not expected'"
          # Root ne sert qu'au démarrage (propriété du volume) : plus aucun service ne doit tourner en root
          rootprocs=$(docker exec ot ps -o user,comm | tail -n +2 | awk '$1 != "erugo" && $1 != "1000" && $2 != "ps"' | tr '\n' ' ')
          check "aucun service ne tourne en root (trouvé : ${rootprocs:-aucun})" test -z "$rootprocs"
          check "le code est en lecture seule pour l'application" sh -c "! docker exec -u erugo ot sh -c 'touch /var/www/html/public/x' 2>/dev/null"

          # Adresse du client : Caddy et Laravel doivent croire le même proxy, et lui seul.
          first_admin() {
            curl -s -o /dev/null -X POST -H 'Content-Type: application/json' \
              -d '{"name":"Admin","email":"admin@example.test","password":"smoke-test-password","password_confirmation":"smoke-test-password"}' \
              "http://localhost:$1/api/setup"
            curl -s -X POST -H 'Content-Type: application/json' \
              -d '{"email":"admin@example.test","password":"smoke-test-password"}' \
              "http://localhost:$1/api/auth/login" | jq -r .data.access_token
          }
          seen_ip() {
            curl -s -H "Authorization: Bearer $2" -H "X-Forwarded-For: $3" "http://localhost:$1/api/settings/client-ip" | jq -r .data.ip
          }
          login_from() {
            curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -H "X-Forwarded-For: $2" \
              -d '{"email":"admin@example.test","password":"smoke-test-password"}' "http://localhost:$1/api/auth/login"
          }
          jwt=$(first_admin 8080)
          ip=$(seen_ip 8080 "$jwt" 203.0.113.50)
          check "sans TRUSTED_PROXIES, X-Forwarded-For est ignoré (vu : $ip)" sh -c "echo '$ip' | grep -qE '^[0-9a-f.:]+$' && [ '$ip' != 203.0.113.50 ]"
          out=$(docker exec ot ot-artisan disable-ip-allowlist 2>&1 | tail -n 1)
          check "ot-artisan fonctionne via docker exec (reçu : $out)" sh -c "echo '$out' | grep -q 'is disabled'"

          # Double authentification avec la base, le cache et le chiffrement réels de l'image
          totp_code() {
            docker exec ot php -r 'require "/var/www/html/vendor/autoload.php"; echo App\Services\Totp::codeAt($argv[1], App\Services\Totp::timestep() + (int) $argv[2]);' -- "$1" "$2"
          }
          api_post() {
            curl -s -X POST -H 'Content-Type: application/json' -H 'Accept: application/json' ${3:+-H "Authorization: Bearer $3"} -d "$2" "http://localhost:8080$1"
          }
          creds='{"email":"admin@example.test","password":"smoke-test-password"}'
          secret=$(api_post /api/users/me/2fa/totp/setup '{"password":"smoke-test-password"}' "$jwt" | jq -r .data.secret)
          codes=$(api_post /api/users/me/2fa/totp/confirm "{\"code\":\"$(totp_code "$secret" -1)\"}" "$jwt" | jq -r '.data.recovery_codes | length')
          check "2FA : activation avec 10 codes de secours (reçu : $codes)" test "$codes" = 10
          step=$(api_post /api/auth/login "$creds")
          status=$(echo "$step" | jq -r .status)
          token=$(echo "$step" | jq -r .data.mfa_token)
          check "2FA : le mot de passe seul n'ouvre pas de session (reçu : $status)" test "$status" = mfa_required
          wrong=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d "{\"mfa_token\":\"$token\",\"method\":\"totp\",\"code\":\"000000\"}" http://localhost:8080/api/auth/mfa/verify)
          check "2FA : mauvais code refusé (reçu $wrong)" test "$wrong" = 401
          opened=$(api_post /api/auth/mfa/verify "{\"mfa_token\":\"$token\",\"method\":\"totp\",\"code\":\"$(totp_code "$secret" 0)\"}" | jq -r .status)
          check "2FA : le bon code ouvre la session (reçu : $opened)" test "$opened" = success
          docker exec ot ot-artisan reset-2fa admin@example.test >/dev/null 2>&1 || true
          direct=$(api_post /api/auth/login "$creds" | jq -r .status)
          check "2FA : reset-2fa la retire (reçu : $direct)" test "$direct" = success
          # La bibliothèque WebAuthn tourne avec les extensions PHP de l'image
          rp=$(api_post /api/users/me/passkeys/options '{"password":"smoke-test-password"}' "$jwt" | jq -r .data.options.rp.id)
          check "clés d'accès : options générées dans l'image (rp : $rp)" test "$rp" = localhost

          # Chiffrement au repos : refusé sans clé, ce qui protège d'un faux sentiment de sécurité
          refused=$(api_post /api/auth/login "$creds" | jq -r .data.access_token)
          refused=$(curl -s -X PUT -H "Authorization: Bearer $refused" -H 'Content-Type: application/json' -H 'Accept: application/json' \
            -d '{"settings":[{"key":"storage_encryption_enabled","value":"true"}]}' http://localhost:8080/api/settings | jq -r .code)
          check "chiffrement : activation refusée sans clé (reçu : $refused)" test "$refused" = storage_key_missing

          leftovers=$(docker exec ot find /var/www/html/storage ! -user erugo | wc -l)
          check "ot-artisan ne laisse aucun fichier à root (trouvés : $leftovers)" test "$leftovers" = 0

          # Déploiement durci : sans root, sans capacités, système de fichiers en lecture seule
          # (derrière un proxy : l'hôte arrive depuis le réseau Docker)
          docker run -d --name ot-hard --user 1000:1000 --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges -e TRUSTED_PROXIES=172.16.0.0/12 \
            -v ot-hard-storage:/var/www/html/storage -p 8081:80 opentransfer:smoke
          hard=000
          for i in $(seq 1 60); do
            hard=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/ || true)
            [ "$hard" = "200" ] && break
            sleep 2
          done
          check "mode durci : l'accueil répond 200 (reçu $hard)" test "$hard" = 200
          sleep 5
          check "mode durci : tusd et le worker tournent" sh -c "docker exec ot-hard pgrep -f /usr/local/bin/tusd && docker exec ot-hard pgrep -f 'artisan queue:work'"
          check "mode durci : aucun processus abandonné" sh -c "! docker logs ot-hard 2>&1 | grep -qE 'gave up|FATAL|exited: .*not expected'"
          jwt=$(first_admin 8081)
          ip=$(seen_ip 8081 "$jwt" '198.51.100.99, 203.0.113.50')
          check "avec TRUSTED_PROXIES, l'adresse vient du proxy, sans la partie forgée (vu : $ip)" test "$ip" = 203.0.113.50
          saved=$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H "Authorization: Bearer $jwt" -H 'Content-Type: application/json' -H 'X-Forwarded-For: 203.0.113.50' \
            -d '{"settings":[{"key":"login_ip_allowlist_enabled","value":"true"},{"key":"login_ip_allowlist","value":"203.0.113.50"}]}' http://localhost:8081/api/settings)
          check "liste blanche : activation enregistrée (reçu $saved)" test "$saved" = 200
          outside=$(login_from 8081 198.51.100.7)
          inside=$(login_from 8081 203.0.113.50)
          check "liste blanche : connexion refusée hors liste (reçu $outside)" test "$outside" = 403
          check "liste blanche : connexion acceptée dans la liste (reçu $inside)" test "$inside" = 200
          docker exec ot-hard ot-artisan disable-ip-allowlist >/dev/null 2>&1 || true
          recovered=$(login_from 8081 198.51.100.7)
          check "liste blanche : la commande de secours rouvre la connexion (reçu $recovered)" test "$recovered" = 200
          [ "$fails" -eq 0 ]

      # Bloque la publication si l'image contient une vulnérabilité critique corrigeable
      - name: Scan de vulnérabilités (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: opentransfer:smoke
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      # Les journaux bruts d'Actions exigent une authentification, pas les annotations :
      # on y remonte le diagnostic pour qu'il soit lisible par tous (et par l'automatisation).
      - name: Diagnostic du conteneur
        if: failure()
        run: |
          {
            echo "== laravel.log (erreurs) =="
            docker exec ot sh -c 'grep -E "\.(ERROR|CRITICAL|ALERT|EMERGENCY):" /var/www/html/storage/logs/laravel.log | tail -n 5' 2>&1 || true
            echo "== supervisord =="
            docker logs ot 2>&1 | grep -E 'WARN|ERROR|exited|gave up' | tail -n 15
            echo "== fin des journaux =="
            docker logs ot 2>&1 | tail -n 15
            echo "== mode durci =="
            docker logs ot-hard 2>&1 | grep -E 'WARN|ERROR|rror|denied|exited|gave up' | tail -n 15 || true
          } > diagnostic.txt
          cat diagnostic.txt
          msg=$(sed -e 's/%/%25/g; s/\r//g' diagnostic.txt | sed -e ':a;N;$!ba;s/\n/%0A/g' | cut -c1-60000)
          echo "::error title=Diagnostic du conteneur::${msg}"

      - name: Connexion à ghcr.io
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publication multi-architecture
        id: push
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/alpine/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.APP_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: steps.push.outcome == 'success'

      # Signature sans clé (Sigstore) liée à ce workflow : le serveur peut vérifier
      # que l'image vient bien de cette CI avant de la déployer.
      - name: Signature de l'image (cosign)
        if: steps.push.outcome == 'success'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          identity="^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/ci\.yml@"
          verify() {
            cosign verify "${IMAGE}@${DIGEST}" --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "$identity" > /dev/null
          }
          # Une image reconstruite à l'identique garde son digest : déjà signée, rien à faire
          if verify 2> /dev/null; then
            echo "::notice::${DIGEST} est déjà signé par ce workflow"
            exit 0
          fi
          # Rekor peut accepter une entrée sans que la réponse revienne : cosign la rejoue
          # alors avec la même clé et échoue en conflit (409 puis 404). Chaque nouvel essai
          # repart d'une clé éphémère neuve, donc d'une entrée sans conflit possible.
          for attempt in 1 2 3; do
            if cosign sign --yes "${IMAGE}@${DIGEST}" 2> sign.err; then
              verify
              echo "Image signée : ${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if verify 2> /dev/null; then
              echo "::notice::signature attachée malgré l'erreur de l'essai ${attempt}"
              exit 0
            fi
            echo "::warning::essai ${attempt} de signature en échec, nouvel essai"
            sleep $((attempt * 20))
          done
          cat sign.err
          msg=$(tail -n 20 sign.err | sed -e 's/%/%25/g; s/\r//g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Signature cosign::${msg}"
          exit 1
