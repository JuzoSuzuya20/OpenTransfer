; supervisord and every program run as the unprivileged erugo user
; (start-container drops root before exec'ing supervisord).
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=/usr/sbin/php-fpm85 -F -y /etc/php85/php-fpm-erugo.conf
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
priority=5

[program:caddy]
command=/usr/sbin/caddy run --config /etc/caddy/Caddyfile
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
priority=10

[program:tusd]
; Loopback only: Caddy proxies /files/ to it, nothing else should reach tusd directly
command=/usr/local/bin/tusd -host 127.0.0.1 -port 8080 -behind-proxy -hooks-http http://localhost:%(ENV_ERUGO_PORT)s/api/tusd-hooks -upload-dir /var/www/html/storage/app/uploads -base-path /files/
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
priority=15

[program:eurgo-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stopwaitsecs=3600

[program:eurgo-scheduler]
; Replaces the root cron daemon
command=php /var/www/html/artisan schedule:work
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
